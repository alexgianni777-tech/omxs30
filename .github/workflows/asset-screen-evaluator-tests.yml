name: Asset Screen evaluator regression tests
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/asset-screen-evaluator-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.50,<1' 'pandas>=2.2,<3'
      - name: Compile
        run: python -m py_compile research/market_backtest.py research/test_market_backtest.py
      - name: Regression tests
        run: python -m unittest discover -s research -p 'test_*.py' -v
