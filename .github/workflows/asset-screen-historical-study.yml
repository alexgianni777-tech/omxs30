name: Asset Screen historical signal and trend research
on:
  pull_request:
    paths:
      - 'research/**'
      - 'candidates-log.csv'
      - '.github/workflows/asset-screen-historical-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical price client
        run: python -m pip install 'yfinance==0.2.66'
      - name: Run offline regression tests (no market quotes needed)
        run: python -m unittest research.test_market_backtest research.test_signal_trend_study -v
      - name: Evaluate archived trade plans against Yahoo OHLC as of 2026-11-06
        run: |
          python research/market_backtest.py --signals candidates-log.csv --asof 2026-11-06 --out research_results
      - name: Study historical index-only trend alignment and indicative costs
        run: |
          python research/signal_trend_study.py --trades research_results/trades.csv --asof 2026-11-06 --out research_results --roundtrip-cost-bps 20
      - name: Print concise outcome to GitHub job summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('research_results/trend_study.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Historical signal study – research only, NOT validated alpha\n\n')
              if not path.exists():
                  f.write('Research could not finish. Consult the job failure and download artifacts.\n')
              else:
                  report=json.loads(path.read_text())
                  f.write('Signal window as-of: '+report['study_asof']+'\n\n')
                  f.write('Index regime status: '+report['market_context']['status']+'\n\n')
                  f.write('| Group | Plans | Completed | Net proxy expectancy (R) | Profit factor |\n')
                  f.write('|---|---:|---:|---:|---:|\n')
                  for family in ('kind','alignment'):
                      for key,g in report['grouped'][family].items():
                          f.write(f"| {family}: {key} | {g['plans']} | {g['executed_with_priced_exit']} | {g['cost_proxy_net_expectancy_r_conditional']} | {g['cost_proxy_profit_factor']} |\n")
                  f.write('\n**All results descriptive; repeated signals overlap and execution is approximate.**\n')
          PY
      - name: Upload research artifacts for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-screen-historical-study-20261106
          path: research_results/
          if-no-files-found: warn
          retention-days: 30
