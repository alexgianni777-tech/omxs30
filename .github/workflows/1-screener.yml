name: 1 · Daglig screener

on:
  schedule:
    - cron: '15 22 * * 1-5'
      timezone: 'Europe/Stockholm'
    - cron: '15 6,9,12,15,18 * * 1-6'
      timezone: 'Europe/Stockholm'
    - cron: '42 8,17 * * 1-6' # UTC-reservstarter, även om tidszons-schemat tappas
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Rapportdag att köra om (YYYY-MM-DD), eller tom för senaste'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: omxs30-screening
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Välj handelsdag och kontrollera om listan redan skickats
        id: report
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            [[ "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Ogiltigt rapportdatum"; exit 1; }
            REPORT_DATE="$REQUESTED_DATE"
          elif [ "$SCHEDULE" = '15 6,9,12,15,18 * * 1-6' ] || [ "$SCHEDULE" = '42 8,17 * * 1-6' ]; then
            REPORT_DATE=$(node report-date.js --retry)
            echo "RETRY=1" >> "$GITHUB_ENV"
          else
            REPORT_DATE=$(node report-date.js)
          fi

          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "Rapportdatum: $REPORT_DATE"

          if [ -f "sent-reports/$REPORT_DATE" ]; then
            if [ -f "dashboard-pending/$REPORT_DATE" ]; then
              echo "dashboard_only=true" >> "$GITHUB_OUTPUT"
              echo "Telegram levererat; återförsöker bara dashboard-import."
            else
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "Redan skickad; hoppar över utskick."
            fi
          fi

      - name: Kör screener → Telegram + Dashboard med egna data-retries
        id: send
        if: steps.report.outputs.already != 'true'
        env:
          DASHBOARD_ONLY: ${{ steps.report.outputs.dashboard_only }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_IMPORT_SECRET: ${{ secrets.DASHBOARD_IMPORT_SECRET }}
        run: |
          max_attempts=1
          retry_sleep=0

          # Schemalagda återförsök ska inte vara beroende av att GitHub startar
          # nästa cron exakt i tid. En körning provar själv var 20:e minut.
          if [ "${RETRY:-}" = '1' ]; then
            max_attempts=8
            retry_sleep=1200
          fi

          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Screenerförsök $attempt/$max_attempts för $REPORT_DATE"

            set +e
            node notify.js omxs30-screener.js
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "waiting=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$status" -eq 76 ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "waiting=dashboard" >> "$GITHUB_OUTPUT"
              echo "Telegram är redan levererat; dashboard-import väntar."
              exit 0
            fi

            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi

            echo "Yahoo-dagskurser saknas ännu för $REPORT_DATE."

            # Ett enda informationsmeddelande per rapportdag. Markeringen sparas
            # efter steget så senare cron-körningar inte skickar samma status igen.
            if [ "${RETRY:-}" = '1' ] && [ ! -f "waiting-report-alerts/$REPORT_DATE" ]; then
              if node alert-waiting.js "$REPORT_DATE"; then
                mkdir -p waiting-report-alerts
                printf 'Väntestatus skickad %s\n' "$(date -u +%FT%TZ)" > "waiting-report-alerts/$REPORT_DATE"
                echo "wait_notice=true" >> "$GITHUB_OUTPUT"
              else
                echo "Kunde inte skicka väntestatus; fortsätter data-retries ändå."
              fi
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "waiting=data" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Försöker igen om 20 minuter."
            sleep "$retry_sleep"
            attempt=$((attempt + 1))
          done

      - name: Spara väntestatus om rapporten ännu saknas
        if: steps.send.outputs.wait_notice == 'true' && steps.send.outputs.ready == 'false'
        run: |
          git config user.name "omxs30-bot"
          git config user.email "actions@github.com"
          git add "waiting-report-alerts/$REPORT_DATE"
          git commit -m "Markera väntande screener $REPORT_DATE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Meddela om dagsrapport fortfarande saknas efter sista försöket
        if: steps.send.outputs.waiting == 'data'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          hour=$(TZ=Europe/Stockholm date +%H)
          if [ "${RETRY:-}" != '1' ] || [ "$hour" -lt 18 ] || [ -f "missing-report-alerts/$REPORT_DATE" ]; then
            exit 0
          fi

          node alert-unavailable.js "$REPORT_DATE"
          mkdir -p missing-report-alerts
          printf 'Saknad rapport meddelad %s\n' "$(date -u +%FT%TZ)" > "missing-report-alerts/$REPORT_DATE"
          git config user.name "omxs30-bot"
          git config user.email "actions@github.com"
          git add "missing-report-alerts/$REPORT_DATE"
          git commit -m "Varna om saknad screener $REPORT_DATE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Spara skickad handelsdag och leveransstatus
        if: steps.report.outputs.already != 'true' && steps.send.outputs.ready != 'false'
        env:
          DASHBOARD_ONLY: ${{ steps.report.outputs.dashboard_only }}
        run: |
          git config user.name "omxs30-bot"
          git config user.email "actions@github.com"

          if [ "$DASHBOARD_ONLY" = 'true' ]; then
            git add -u -- "dashboard-pending/$REPORT_DATE"
          else
            mkdir -p sent-reports
            printf 'Telegram skickat för %s vid %s\n' "$REPORT_DATE" "$(date -u +%FT%TZ)" > "sent-reports/$REPORT_DATE"
            git add -- candidates-log.csv "sent-reports/$REPORT_DATE" "report-outputs/$REPORT_DATE.txt"
            if [ -f "dashboard-pending/$REPORT_DATE" ]; then
              git add -- "dashboard-pending/$REPORT_DATE"
            fi
            if [ -f "waiting-report-alerts/$REPORT_DATE" ]; then
              git add -- "waiting-report-alerts/$REPORT_DATE"
            fi
          fi

          if git diff --cached --quiet; then
            echo "Ingen leveransstatus att uppdatera."
            exit 0
          fi

          git commit -m "Uppdatera screener-leverans $REPORT_DATE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
